# Four test tiers, one mark each. --strict-markers turns a typo'd mark into a collection error,
# so a tier gate can never pass over zero tests.
[pytest]
addopts = --strict-markers -q
testpaths = tests
pythonpath = src tests
markers =
    case: one concrete input/output pair.
    integration: crosses a real boundary (process, filesystem).
    property: generated inputs over an invariant.
    eval: scores a non-deterministic output against a stated threshold.
