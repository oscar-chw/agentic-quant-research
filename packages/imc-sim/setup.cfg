[metadata]
name = imc4-analysis
version = 0.4.0
description = Offline normalized run accounting and fill diagnostics

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
imc4_analysis = data/*.jsonl, data/*.json

[options.entry_points]
console_scripts =
    imc4-analyze = imc4_analysis.cli:main
