[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantos-showcase"
version = "0.10.0"
description = "Offline connected quant research demonstration over installed shared packages"
requires-python = ">=3.11"
dependencies = ["quant-marketdata==0.5.0", "qrae-rd==0.16.0", "quant-paper-store==0.4.0", "offline-factor-research==0.4.0"]

[project.optional-dependencies]
portfolio = ["imc4-analysis==0.4.0"]

[project.scripts]
quantos-loop = "quantos_showcase.loop:main"
quantos-execution = "quantos_showcase.execution:main"
quantos-method = "quantos_showcase.methods:main"
quantos-index = "quantos_showcase.run_index:main"
quantos-feed = "quantos_showcase.feed:main"
quantos-quotes = "quantos_showcase.quotes:main"
quantos-demo = "quantos_showcase.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
