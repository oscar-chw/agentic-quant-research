[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-paper-store"
version = "0.4.0"
description = "Offline SQLite paper metadata core from the quant research vault"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
py-modules = ["paper_store", "source_access", "method_contract", "note_index"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
files = ["paper_store.py", "source_access.py", "method_contract.py", "note_index.py", "search_mcp.py"]
