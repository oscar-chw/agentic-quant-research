[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrae-rd"
version = "0.16.0"
description = "Local-first, human-gated quantitative research orchestration system"
requires-python = ">=3.10"
dependencies = ["tzdata>=2025.2; platform_system == 'Windows'"]

[project.scripts]
qrae = "qrae.cli:main"

[project.optional-dependencies]
full = ["pytest>=8.0"]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.16.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qrae = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "I", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
