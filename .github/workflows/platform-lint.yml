# The platform's lint with its own ruff.toml (its per-file ignores keep two frozen imc-sim files byte-identical).
# Own concurrency group: sharing lint.yml's "lint-<ref>" would let each workflow cancel the other.
name: platform-lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: platform-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.10
      - run: ruff check --config ruff.toml .
