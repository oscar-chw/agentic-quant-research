[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pmlab"
version = "0.1.0"
description = "Advances in Financial Machine Learning as a tested library, built by gated AI coding agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyarrow", "requests"]

[tool.setuptools.packages.find]
where = ["src"]
